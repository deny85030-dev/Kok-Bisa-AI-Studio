<body class="bg-slate-50 text-slate-800 antialiased selection:bg-blue-500 selection:text-white">

    <script type="text/babel">
        const Icon = ({ path, className = "w-4 h-4", viewBox = "0 0 24 24", fill = "none", stroke = "currentColor", strokeWidth = "2" }) => (

        const Sparkles = (props) => <Icon {...props} path={<><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></>} />;
        const Settings = (props) => <Icon {...props} path={<><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></>} />;
        const Check = (props) => <Icon {...props} path={<polyline points="20 6 9 17 4 12"/>} />;
        const Copy = (props) => <Icon {...props} path={<><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></>} />;
        const Search = (props) => <Icon {...props} path={<><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>} />;
        const ChevronRight = (props) => <Icon {...props} path={<path d="m9 18 6-6-6-6"/>} />;
        const ChevronLeft = (props) => <Icon {...props} path={<path d="m15 18-6-6 6-6"/>} />;
        const RefreshCw = (props) => <Icon {...props} path={<><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></>} />;
        const Zap = (props) => <Icon {...props} path={<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>} />;
        const AlertCircle = (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></>} />;
        const ImageIcon = (props) => <Icon {...props} path={<><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></>} />;
        const Star = (props) => <Icon {...props} path={<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>} />;
        const ExternalLink = (props) => <Icon {...props} path={<><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></>} />;
        const Globe = (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></>} />;
        const TrendingUp = (props) => <Icon {...props} path={<><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></>} />;
        const Palette = (props) => <Icon {...props} path={<><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.92 0 1.7-.71 1.7-1.63 0-.43-.17-.83-.44-1.12a1.64 1.64 0 0 1 1.16-2.75H17c2.76 0 5-2.24 5-5 0-5.5-4.5-10-10-10z"/></>} />;
        const CheckCircle2 = (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></>} />;
        const Video = (props) => <Icon {...props} path={<><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></>} />;

        const DEFAULT_GEMINI_KEY = ""; // Provided at runtime or user setting

        const VISUAL_STYLES = [
          { id: 'flat_vector', label: 'Modern Flat Vector', icon: '🎨', promptPrefix: 'Modern Educational Animation, Flat Illustration, Clean Vector Art, Kok Bisa Style, vibrant palette' },
          { id: 'realistic', label: 'Realistik Fotografi', icon: '📷', promptPrefix: 'Realistic Photographic, ultra detailed studio photography, photorealistic, dramatic natural lighting, 8k resolution' },
          { id: 'pixar_3d', label: '3D Animation (Pixar)', icon: '✨', promptPrefix: '3D Character Animation, Pixar Visual Style, Expressive 3D render, Vibrant Cinema 4D Lighting' },
          { id: 'anime', label: 'Anime Manga Keyframe', icon: '🌸', promptPrefix: 'Anime Keyframe Art, Japanese Animation Style, Makoto Shinkai aesthetic, vivid cell shading, dramatic anime lighting' },
          { id: 'sketch', label: 'Cinematic Sketch', icon: '✏️', promptPrefix: 'Cinematic Concept Sketch, Hand-drawn Storyboard Art, Pencil & Ink Line Art, Expressive Hatching, Graphic Concept' },
          { id: 'retro_comic', label: 'Retro Comic Book', icon: '📚', promptPrefix: 'Retro Comic Book Style, Halftone Dots, Vintage Color Palette, Classic Pop Art Graphic Novel' },
          { id: 'watercolor', label: 'Watercolor Concept', icon: '🖌️', promptPrefix: 'Watercolor Concept Art, Artistic Brush Strokes, Soft Pastel Color Palette, Storybook Painting, Fluid Inks' },
          { id: 'cinematic_film', label: 'Cinematic Film', icon: '🎬', promptPrefix: 'Cinematic Film Stills, 35mm Movie Shot, Dynamic Atmospheric Lighting, Moody Composition, Anamorphic Lens' }
        ];

        async function callGeminiAPI(prompt, apiKey, systemInstruction, useSearch = false) {
          const keyToUse = apiKey && apiKey.trim() !== "" ? apiKey.trim() : DEFAULT_GEMINI_KEY;
          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${keyToUse}`;

          const requestBody = {
            contents: [{ role: "user", parts: [{ text: prompt }] }]
          };

          if (systemInstruction) {
            requestBody.systemInstruction = { parts: [{ text: systemInstruction }] };
          }

          if (useSearch) {
            requestBody.tools = [{ googleSearch: {} }];
          }

          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(requestBody)
          });

          if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.error?.message || `Gemini API Error: ${response.status}`);
          }

          const data = await response.json();
          const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
          
          let sources = [];
          const groundingChunks = data.candidates?.[0]?.groundingMetadata?.groundingChunks;
          if (groundingChunks && Array.isArray(groundingChunks)) {
            sources = groundingChunks
              .filter(chunk => chunk.web)
              .map(chunk => ({
                title: chunk.web.title || chunk.web.uri,
                uri: chunk.web.uri
              }));
          }

          return { text, sources };
        }

        async function generateImagePreview(prompt, apiKey, aspectRatio = "16:9") {
          const keyToUse = apiKey && apiKey.trim() !== "" ? apiKey.trim() : DEFAULT_GEMINI_KEY;
          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${keyToUse}`;
          
          const payload = {
            instances: [{ prompt: prompt }],
            parameters: { 
              sampleCount: 1,
              aspectRatio: aspectRatio === "9:16" ? "9:16" : "16:9"
            }
          };

          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            throw new Error(`Imagen API Error: ${response.statusText}`);
          }

          const result = await response.json();
          if (result.predictions && result.predictions.length > 0 && result.predictions[0].bytesBase64Encoded) {
            return `data:image/png;base64,${result.predictions[0].bytesBase64Encoded}`;
          }
          throw new Error("Gagal memperoleh gambar dari Imagen API");
        }

        function parseScriptToVisualPrompts(scriptText, visualStyle = VISUAL_STYLES[0].promptPrefix, aspectFormat = "16:9") {
          if (!scriptText || scriptText.trim().length === 0) return [];

          const paragraphs = scriptText
            .split(/\n\s*\n/)
            .map(p => p.trim())
            .filter(p => p.length > 20);

          if (paragraphs.length === 0) return [];

          const scenes = [];
          const ratioDescription = aspectFormat === "9:16" 
            ? "9:16 vertical mobile aspect ratio, vertical portrait composition, full screen phone view" 
            : "16:9 widescreen landscape ratio, horizontal YouTube format";

          paragraphs.forEach((chunk, i) => {
            const sceneIndex = i + 1;
            const sceneNum = String(sceneIndex).padStart(3, '0');
            const contextSnippet = chunk.substring(0, 120) + (chunk.length > 120 ? "..." : "");
            const cleanSceneConcept = chunk.replace(/Begitu kamu|Lalu,|Di sini,|Nah,|Tahukah kamu|Sebab,/gi, '').trim();

            scenes.push({
              id: `img-${sceneIndex}`,
              sceneNum,
              context: `Adegan ${sceneIndex}: ${contextSnippet}`,
              prompt: `${visualStyle}. Detailed concept scene illustration of: ${cleanSceneConcept.substring(0, 150)}. Cinematic framing, expressive storytelling visual, vivid details, ${ratioDescription}.`
            });
          });

          return scenes;
        }

        function parseScriptToSEO(scriptText, topicTitle) {
          const cleanTitle = topicTitle && topicTitle.trim() !== "" ? topicTitle : "Topik Edukasi Sains";

          return {
            seoTitles: [
              `${cleanTitle} (Penjelasan Lengkap & Alur Cerita)`,
              `Sains Di Balik ${cleanTitle}: Rahasia Yang Jarang Orang Tahu`,
              `Bagaimana Proses ${cleanTitle}? (Kisah Narasi Edukasi)`,
              `Kisah Menakjubkan: ${cleanTitle}`,
              `Apa Yang Sebenarnya Terjadi Pada ${cleanTitle}?`
            ],
            videoDescription: `Pernahkah kamu penasaran bagaimana fenomena di balik ${cleanTitle}?\n\nDalam video animasi edukasi kali ini, kita akan menyusuri alur cerita naratif alami mulai dari fakta sejarah, rahasia sains, hingga refleksi mendalam!\n\nSimak alur ceritanya sampai habis ya!\n\nJangan lupa Like, Subscribe, dan share video edukasi ini ke teman-temanmu!`,
            seoKeywords: `${cleanTitle.toLowerCase()}, sains indonesia, edukasi animasi, cerita sains, kok bisa, alur cerita narasi, fakta unik, fenomena alam`,
            youtubeTags: [cleanTitle.toLowerCase(), "sains", "edukasi", "cerita animasi", "kok bisa", "storytelling", "youtube long form", "fakta unik"],
            hashtags: `#Sains #Edukasi #Storytelling #KokBisa #${cleanTitle.replace(/[^a-zA-Z0-9]/g, '')}`,
            pinnedComment: `Bagian alur cerita mana dari ${cleanTitle} yang paling berkesan buat kamu? Tulis di kolom komentar ya! 👇`
          };
        }

        const CREATE_EMPTY_PROJECT = () => ({
          id: `session-${Date.now()}`,
          title: "", // Empty default title as requested
          format: "16:9",
          category: "Fakta Unik",
          mode: "Sedang Viral (Trending Google)",
          targetAudience: "Remaja & Dewasa Muda (15-30 tahun)",
          style: "Edukasi Naratif Santai & Menarik",
          language: "Bahasa Indonesia",
          currentStep: 1,
          updatedAt: new Date().toISOString(),
          step1Data: { selectedTopic: "", selectedReason: "", topics: [] },
          step2Data: { targetDuration: "10-15 Menit", customInstruction: "", wordCount: 0, estimatedDuration: "0 Menit", script: "" },
          step3Data: { selectedStyleId: "flat_vector", visualStyle: VISUAL_STYLES[0].promptPrefix, prompts: [] },
          step4Data: { animationStyle: "Animasi lambat, transisi mulus, pergerakan kamera sinematik", videoPrompts: [] },
          step5Data: { ctrAnalysis: "", selectedTextOption: "", textOptions: [], visualConcept: "", readyPrompt: "" },
          step6Data: { seoTitles: [], videoDescription: "", seoKeywords: "", youtubeTags: [], hashtags: "", pinnedComment: "" }
        });

        function App() {
          const [activeTab, setActiveTab] = React.useState('editor');
          const [project, setProject] = React.useState(CREATE_EMPTY_PROJECT);
          const [apiKey, setApiKey] = React.useState(DEFAULT_GEMINI_KEY);
          
          const [isGenerating, setIsGenerating] = React.useState(false);
          const [loadingStepText, setLoadingStepText] = React.useState('');
          const [toast, setToast] = React.useState(null);
          const [groundingSources, setGroundingSources] = React.useState([]);
          
          const [imagePreviews, setImagePreviews] = React.useState({});
          const [loadingImageId, setLoadingImageId] = React.useState(null);
          const [showResetConfirm, setShowResetConfirm] = React.useState(false);

          const showToast = (message, type = 'info') => {
            setToast({ message, type });
            setTimeout(() => setToast(null), 3500);
          };

          const copyToClipboard = async (text, label = "Teks") => {
            if (!text) {
              showToast("Tidak ada teks untuk disalin", "error");
              return;
            }

            let success = false;
            try {
              if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(text);
                success = true;
              }
            } catch (err) {
              console.warn("Clipboard API error, fallback...", err);
            }

            if (!success) {
              try {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                textArea.style.top = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                success = document.execCommand('copy');
                document.body.removeChild(textArea);
              } catch (err) {
                console.error("Fallback copy failed:", err);
              }
            }

            if (success) {
              showToast(`${label} berhasil disalin!`, "success");
            } else {
              showToast(`Gagal menyalin ${label}. Silakan salin secara manual.`, "error");
            }
          };

          const syncAllStepsWithScript = (scriptText, title, visualStyle, format = project.format) => {
            const generatedVisualPrompts = parseScriptToVisualPrompts(scriptText, visualStyle, format);
            
            const motionStyle = format === "9:16"
              ? "Vertical dynamic camera tilt and slow vertical pan. Smooth mobile-optimized 2D animation"
              : "Slow horizontal camera movement. Cinematic smooth 2D widescreen vector animation";

            const generatedVideoPrompts = generatedVisualPrompts.map((vp) => ({
              id: `vid-${vp.id}`,
              sceneNum: vp.sceneNum,
              prompt: `${motionStyle} of: ${vp.context}. High resolution, 60fps style, ${format} orientation.`
            }));

            const seoData = parseScriptToSEO(scriptText, title);

            setProject(prev => {
              const selectedText = prev.step5Data.selectedTextOption || title || "Judul Thumbnail Menarik";
              
              const readyPrompt = format === "9:16" 
                ? `A high-quality 9:16 vertical cover frame for YouTube Shorts / TikTok in ${visualStyle} visual style. [TOPIC]: ${title || 'Edukasi Sains'}. [MAIN CHARACTER]: Expressive focus in center portrait. [TYPOGRAPHY]: Large bold vertical stacked text '${selectedText}'. High contrast, 9:16 vertical ratio.`
                : `A high-quality 16:9 widescreen YouTube thumbnail in ${visualStyle} visual style. [TOPIC]: ${title || 'Edukasi Sains'}. [MAIN CHARACTER]: Expression of wonder or surprise. [TYPOGRAPHY]: Large clear headline text '${selectedText}'. High contrast, 16:9 ratio.`;

              return {
                ...prev,
                step3Data: { ...prev.step3Data, prompts: generatedVisualPrompts },
                step4Data: { ...prev.step4Data, videoPrompts: generatedVideoPrompts },
                step5Data: { ...prev.step5Data, readyPrompt },
                step6Data: { ...prev.step6Data, ...seoData }
              };
            });
          };

          const setStep = (stepNumber) => {
            setProject(prev => ({ ...prev, currentStep: stepNumber }));
          };

          const handleGenerateTopics = async (category, mode) => {
            setIsGenerating(true);
            setLoadingStepText("Mencari tren terbaru di Google Search & menganalisis ide topik viral...");
            setGroundingSources([]);

            const sysPrompt = "Anda adalah AI Content Strategist untuk channel animasi edukasi terpopuler (seperti Kok Bisa / Kurzgesagt). Tugas Anda adalah mencari tren Google terbaru dan memberikan ide topik edukasi sains/pengetahuan yang sedang banyak dicari orang.";
            const userPrompt = `Gunakan pencarian Google Search untuk menemukan ide-ide topik yang SEDANG TRENDING & VIRAL di internet saat ini mengenai kategori: "${category}" dengan sudut pandang/mode: "${mode}".
            
            Buat 6 rekomendasi ide topik pilihan terbaik yang sempurna dan paling diminati penonton saat ini.
            Format respons harus HANYA berupa JSON Array murni tanpa penjelasan tambahan, dengan atribut:
            - title: judul topik yang sangat menarik dan membuat penasaran
            - reason: penjelasan kenapa topik ini sedang trending dan cocok dibuat cerita long-form
            - score: angka 1 sampai 5
            - badge: contoh "Trending Google #1"
            - recommendedDuration: durasi ideal yang disarankan untuk topik ini (contoh: "45 Detik" atau "12 Menit")`;

            try {
              const { text, sources } = await callGeminiAPI(userPrompt, apiKey, sysPrompt, true);
              setGroundingSources(sources || []);

              const cleanJson = text.replace(/```json/g, '').replace(/```/g, '').trim();
              let parsedTopics = [];
              try {
                parsedTopics = JSON.parse(cleanJson);
              } catch (e) {
                const jsonMatch = cleanJson.match(/\[.*\]/s);
                if (jsonMatch) {
                  parsedTopics = JSON.parse(jsonMatch[0]);
                } else {
                  throw new Error("Gagal menguraikan format topik.");
                }
              }

              const formattedTopics = parsedTopics.map((t, idx) => ({
                ...t,
                id: `topic-${Date.now()}-${idx}`
              }));

              setProject(prev => ({
                ...prev,
                category,
                mode,
                step1Data: {
                  ...prev.step1Data,
                  topics: formattedTopics
                }
              }));
              showToast("Berhasil menemukan ide topik trending dari Google Search!", "success");
            } catch (err) {
              console.error(err);
              showToast("Gagal mencari tren Google. Pastikan koneksi internet terhubung.", "error");
            } finally {
              setIsGenerating(false);
            }
          };

          const handleGenerateScript = async (customInst, targetDuration = "10-15 Menit") => {
            const topic = project.step1Data.selectedTopic || project.title;
            if (!topic || topic.trim() === "") {
              showToast("Silakan pilih atau ketik judul topik terlebih dahulu di Step 1!", "error");
              return;
            }

            setIsGenerating(true);
            setLoadingStepText(`Menyusun naskah penceritaan naratif alami mengalir lurus (target durasi: ${targetDuration})...`);

            let targetMinutes = 10;
            const minuteMatch = targetDuration.match(/(\d+)\s*(?:-|sampai)?\s*(\d+)?\s*(?:menit|min)/i);
            const secondMatch = targetDuration.match(/(\d+)\s*(?:detik|sec)/i);

            if (minuteMatch) {
              targetMinutes = parseInt(minuteMatch[2] || minuteMatch[1], 10);
            } else if (secondMatch) {
              targetMinutes = Math.max(0.5, parseInt(secondMatch[1], 10) / 60);
            }

            const estimatedTargetWords = Math.round(targetMinutes * 130);

            const sysPrompt = `Anda adalah Lead Scriptwriter animasi edukasi populer (seperti Kok Bisa / Kurzgesagt). 
Tugas Anda adalah menulis naskah penceritaan/narasi LONG-FORM yang MENGALIR LURUS & ALAMI SEPERTI CERITA DRAMA / STORYTELLING.

PERATURAN SANGAT CRUCIAL:
1. DILARANG KERAS MENGGUNAKAN JUDUL BAB (seperti "Bab 1", "Bab 2", "Bab 3", "[BAB 1]", "Pendahuluan", "Kesimpulan", dll).
2. Tulis naskah dalam bentuk paragraf-paragraf narasi tutur kata santai, mengalir mulus dari pembukaan yang memikat, ke latar belakang sejarah, ke penjelasan sains detail, hingga refleksi penutup.
3. PANJANG NASKAH HARUS MENYESUAIKAN TARGET DURASI: Target durasi adalah ${targetDuration} (Dibutuhkan minimal sekitar ${estimatedTargetWords} kata!). Tulis serinci dan selengkap mungkin agar durasi terpenuhi.`;

            const userPrompt = `Tulis naskah narasi cerita mengalir lurus tanpa judul bab untuk topik: "${topic}".
Kategori: ${project.category}.
Target Durasi: ${targetDuration} (Target kata: sekitar ${estimatedTargetWords} kata).
Instruksi Tambahan: ${customInst || 'Buat sangat menarik, alami, mendalam, dan komunikatif.'}`;

            try {
              const { text } = await callGeminiAPI(userPrompt, apiKey, sysPrompt, false);
              const words = text.trim().split(/\s+/).length;
              const estMinutes = Math.ceil(words / 130);

              setProject(prev => ({
                ...prev,
                step2Data: {
                  targetDuration,
                  customInstruction: customInst,
                  script: text,
                  wordCount: words,
                  estimatedDuration: `${Math.max(1, estMinutes - 2)}-${estMinutes} Menit`
                }
              }));

              syncAllStepsWithScript(text, topic, project.step3Data.visualStyle);
              showToast("Naskah narasi mengalir lurus berhasil dibuat!", "success");

PERATURAN PENTING:
1. DILARANG menempelkan teks narasi Bahasa Indonesia mentah ke dalam prompt!
2. Terjemahkan esensi adegan ke dalam deskripsi visual Bahasa Inggris yang kaya: sebutkan Subjek Utama (Main Subject), Aksi/Kondisi (Action/State), Lingkungan/Latar Belakang (Environment), Sudut Kamera (Camera Angle: close-up, macro view, wide cinematic angle), serta Pencahayaan & Suasana (Lighting & Atmosphere).
3. Buat adegan berurutan sesuai alur naskah cerita.
4. Sesuaikan komposisi dengan rasio ${project.format}.

Format Output HARUS JSON Array murni tanpa markdown tambahan:
[
  {
    "sceneNum": "001",
    "context": "Ringkasan adegan narasi singkat dlm Bahasa Indonesia",
    "visualDescription": "Detailed English visual scene description containing subjects, environment, camera perspective, lighting, and focal details"

]`;

Rasio Format: ${project.format}
Gaya Visual Pilihan: ${project.step3Data.visualStyle}

Naskah Cerita Lengkap:
${project.step2Data.script}

Buat daftar prompt visual sinematik per adegan dalam format JSON Array murni.`;

                              </div>
                              <h2 className="text-xl font-bold text-slate-900 mt-1">Thumbnail Studio</h2>
                              <p className="text-sm text-slate-500">Optimalkan klik penonton (CTR) dengan pilihan kata-kata thumbnail dan prompt desain visual yang kuat.</p>
                            </div>
                          </div>

                          <div className="space-y-2">
                            <div className="flex items-center justify-between">
                              <label className="text-xs font-bold text-slate-700">Prompt Siap Pakai Desain Thumbnail</label>
                              <button 
                                onClick={() => copyToClipboard(project.step5Data.readyPrompt, "Prompt Thumbnail")}
                                className="text-[11px] font-semibold text-blue-600 hover:text-blue-700 flex items-center space-x-1"
                              >
                                <Copy className="w-3 h-3" />
                                <span>Salin Prompt</span>
                              </button>
                            </div>
                            
                            <textarea 
                              rows={4}
                              value={project.step5Data.readyPrompt}
                              onChange={(e) => setProject({ ...project, step5Data: { ...project.step5Data, readyPrompt: e.target.value } })}
                              className="w-full text-xs font-mono bg-slate-50 border border-slate-200 rounded-xl p-3 focus:bg-white outline-none"
                            />
                          </div>

                          <div className="flex justify-between items-center pt-4 border-t border-slate-100">
                            <button onClick={() => setStep(4)} className="text-slate-600 hover:text-slate-900 text-xs font-medium flex items-center space-x-1">
                              <ChevronLeft className="w-4 h-4" />
                              <span>Kembali ke Step 4</span>
                            </button>

                            <button onClick={() => setStep(6)} className="bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold px-5 py-2.5 rounded-xl transition flex items-center space-x-2">
                              <span>Lanjut ke Step 6 (YouTube SEO)</span>
                              <ChevronRight className="w-4 h-4" />
                            </button>
                          </div>
                        </div>
                      )}

                      {/* STEP 6: YOUTUBE SEO */}
                      {project.currentStep === 6 && (
                        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-6">
                          <div className="flex items-start justify-between border-b border-slate-100 pb-4">
                            <div>
                              <div className="flex items-center space-x-2">
                                <span className="text-xs font-bold text-blue-600 uppercase tracking-wider">Step 6 dari 6</span>
                                <span className="text-slate-300">•</span>
                                <span className="text-xs text-slate-500">Metadata Publikasi YouTube</span>
                              </div>
                              <h2 className="text-xl font-bold text-slate-900 mt-1">YouTube SEO & Metadata</h2>
                              <p className="text-sm text-slate-500">Rekomendasi judul viral, deskripsi video, kata kunci tag, dan komentar tersemat.</p>
                            </div>
                          </div>

                          <div className="space-y-3">
                            <h3 className="text-xs font-bold text-slate-700 uppercase tracking-wider">Opsi Judul Video YouTube High-CTR</h3>
                            <div className="space-y-2">
                              {project.step6Data.seoTitles.map((t, idx) => (
                                <div key={idx} className="flex items-center justify-between p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium">
                                  <span className="text-slate-800">{t}</span>
                                  <button 
                                    onClick={() => copyToClipboard(t, `Judul ${idx + 1}`)}
                                    className="text-[11px] font-semibold text-blue-600 hover:text-blue-700 flex items-center space-x-1"
                                  >
                                    <Copy className="w-3 h-3" />
                                    <span>Salin</span>
                                  </button>
                                </div>
                              ))}
                            </div>
                          </div>

                          <div className="space-y-2">
                            <div className="flex items-center justify-between">
                              <label className="text-xs font-bold text-slate-700">Deskripsi Video YouTube</label>
                              <button 
                                onClick={() => copyToClipboard(project.step6Data.videoDescription, "Deskripsi Video")}
                                className="text-[11px] font-semibold text-blue-600 hover:text-blue-700 flex items-center space-x-1"
                              >
                                <Copy className="w-3 h-3" />
                                <span>Salin Deskripsi</span>
                              </button>
                            </div>
                            
                            <textarea 
                              rows={6}
                              value={project.step6Data.videoDescription}
                              onChange={(e) => setProject({ ...project, step6Data: { ...project.step6Data, videoDescription: e.target.value } })}
                              className="w-full text-xs font-sans bg-slate-50 border border-slate-200 rounded-xl p-3 focus:bg-white outline-none leading-relaxed"
                            />
                          </div>

                          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="space-y-2">
                              <label className="text-xs font-bold text-slate-700">Hashtags</label>
                              <div className="p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium text-blue-600">
                                {project.step6Data.hashtags || '#Sains #Edukasi #KokBisa'}
                              </div>
                            </div>

                            <div className="space-y-2">
                              <label className="text-xs font-bold text-slate-700">Komentar Tersemat (Pinned Comment)</label>
                              <div className="p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-700">
                                {project.step6Data.pinnedComment || 'Tulis tanggapan kamu di kolom komentar ya!'}
                              </div>
                            </div>
                          </div>

                          <div className="flex justify-between items-center pt-4 border-t border-slate-100">
                            <button onClick={() => setStep(5)} className="text-slate-600 hover:text-slate-900 text-xs font-medium flex items-center space-x-1">
                              <ChevronLeft className="w-4 h-4" />
                              <span>Kembali ke Step 5</span>
                            </button>

                            <button 
                              onClick={() => {
                                copyToClipboard(`JUDUL:\n${project.step6Data.seoTitles[0] || project.title}\n\nNASKAH:\n${project.step2Data.script}\n\nDESKRIPSI:\n${project.step6Data.videoDescription}`, "Seluruh Konten Proyek");
                              }}
                              className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-5 py-2.5 rounded-xl transition flex items-center space-x-2"
                            >
                              <CheckCircle2 className="w-4 h-4" />
                              <span>Salin Seluruh Konten Proyek</span>
                            </button>
                          </div>
                        </div>
                      )}
                    </div>
                  )}

                  {activeTab === 'settings' && (
                    <div className="max-w-2xl mx-auto bg-white p-6 rounded-2xl border border-slate-200 shadow-xs space-y-6">
                      <div>
                        <h2 className="text-xl font-bold text-slate-900">Pengaturan API & Konektivitas</h2>
                        <p className="text-xs text-slate-500">Atur API Key kustom Anda jika ingin menggunakan kuota Anda sendiri untuk Gemini 2.5 Flash & Imagen 4.</p>
                      </div>

                      <div className="space-y-4">
                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">Gemini API Key Kustom (Opsional)</label>
                          <input 
                            type="password" 
                            placeholder="Masukkan Gemini API Key (biarkan kosong untuk kunci bawaan sistem)"
                            value={apiKey}
                            onChange={(e) => setApiKey(e.target.value)}
                            className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl p-3 focus:bg-white outline-none font-mono"
                          />
                          <p className="text-[11px] text-slate-400 mt-1">Sistem secara otomatis menginjeksikan API Key jika dikosongkan.</p>
                        </div>
                      </div>

                      <div className="pt-4 border-t border-slate-100 flex justify-end">
                        <button 
                          onClick={() => showToast("Pengaturan berhasil disimpan!", "success")}
                          className="bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium px-5 py-2.5 rounded-xl transition"
                        >
                          Simpan Pengaturan
                        </button>
                      </div>
                    </div>
                  )}
                </main>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
