<!DOCTYPE html>
<html lang="id">
<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #05070f;
            color: #f0f4f8;
            min-height: 100vh;
        }
        
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        .api-card {
            transition: all 0.2s ease;
        }
        .api-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }
        .api-card.selected {
            border-color: #6366f1;
            background: #eef2ff;
            box-shadow: 0 0 0 2px #6366f1;
        }
        
        .model-tag {
            transition: all 0.15s ease;
        }
        .model-tag:hover {
            transform: scale(1.02);
        }
        .model-tag.selected {
            background: #6366f1;
            color: white;
            border-color: #6366f1;
        }
        
        .lang-btn {
            transition: all 0.2s ease;
        }
        .lang-btn.active {
            background: #6366f1;
            color: white;
            border-color: #6366f1;
        }
        .lang-btn.active:hover {
            background: #4f46e5;
        }
        
        /* ===== LOGIN PAGE STYLES ===== */
        .login-page {
            width: 100%;
            max-width: 420px;
            background: #0d1423;
            border-radius: 24px;
            padding: 36px 32px;
            border: 1px solid #1a2a4a;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
            margin: 20px auto;
        }
        .login-page::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #6c5ce7, #a855f7, #6c5ce7);
            background-size: 200% 100%;
            animation: gradientMove 3s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-page .logo {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-page .logo .icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #6c5ce7, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin: 0 auto 12px;
            box-shadow: 0 8px 30px rgba(108, 92, 231, 0.3);
        }
        .login-page .logo h1 {
            font-size: 22px;
            font-weight: 800;
            color: #f0f4f8;
        }
        .login-page .logo p {
            color: #667799;
            font-size: 13px;
            margin-top: 4px;
        }

        .login-page .form-group {
            margin-bottom: 16px;
        }
        .login-page .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #667799;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .login-page .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #080c18;
            border: 1px solid #1a2a4a;
            border-radius: 12px;
            color: #e8edf5;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        .login-page .form-group input:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
        }
        .login-page .form-group input::placeholder {
            color: #445566;
        }

        .login-page .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6c5ce7, #a855f7);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            margin-top: 8px;
        }
        .login-page .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(108, 92, 231, 0.35);
        }
        .login-page .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .login-page .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            color: #ef4444;
            display: none;
            margin-bottom: 12px;
            text-align: center;
        }
        .login-page .error-msg.show {
            display: block;
            animation: shake 0.4s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #1a2a4a;
            text-align: center;
            font-size: 13px;
            color: #667799;
        }
        .login-page .contact-info a {
            color: #a855f7;
            text-decoration: none;
            font-weight: 600;
        }
        .login-page .contact-info a:hover {
            text-decoration: underline;
        }
        .login-page .contact-info i {
            margin-right: 6px;
        }

        .login-page .version {
            text-align: center;
            font-size: 11px;
            color: #334455;
            margin-top: 16px;
            letter-spacing: 0.5px;
        }

        /* ===== LOADING SPINNER ===== */
        .spinner-small {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.15);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== MAIN APP STYLES ===== */
        #mainApp {
            display: none;
            width: 100%;
            min-height: 100vh;
            background: #f8fafc;
        }
        
        #mainApp .app-loaded {
            background: #f8fafc;
            color: #1e293b;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .login-page {
                padding: 24px 20px;
                border-radius: 16px;
                margin: 10px;
            }
            .login-page .logo h1 { font-size: 19px; }
            .login-page .logo .icon { width: 48px; height: 48px; font-size: 22px; }
            .login-page .form-group input { padding: 10px 14px; font-size: 14px; }
            .login-page .btn-login { padding: 12px; font-size: 15px; }
        }

</head>

    <!-- ========================================================== -->
    <!-- HALAMAN LOGIN -->

    <div class="login-page" id="loginPage">

                async function callAI(prompt, apiKey, systemInstruction, provider = 'openrouter', model = null, useSearch = false) {
                    if (provider === 'gemini') {
                        return await callGeminiAPI(prompt, apiKey, systemInstruction, useSearch);
                    } else if (provider === 'openrouter') {
                        return await callOpenRouterAPI(prompt, apiKey, systemInstruction, model, useSearch);
                    }
                    throw new Error("Provider AI tidak dikenal");
                }

                async function callGeminiAPI(prompt, apiKey, systemInstruction, useSearch = false) {
                  const keyToUse = apiKey ? apiKey.trim() : "";
                  if (!keyToUse) {
                    throw new Error("API Key Gemini tidak ditemukan. Masukkan API Key Anda.");
                  }

                  const models = ["gemini-2.0-flash", "gemini-1.5-flash", "gemini-2.5-flash"];
                  let lastError = null;

                  for (const model of models) {
                    try {
                      const endpoint = \`https://generativelanguage.googleapis.com/v1beta/models/\${model}:generateContent?key=\${keyToUse}\`;

                      const requestBody = {
                        contents: [{ role: "user", parts: [{ text: prompt }] }]
                      };

                      if (systemInstruction) {
                        requestBody.systemInstruction = { parts: [{ text: systemInstruction }] };
                      }

                      if (useSearch) {
                        requestBody.tools = [{ googleSearch: {} }];
                      }

                      const response = await fetch(endpoint, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(requestBody)
                      });

                      if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        const errMsg = errData.error?.message || \`HTTP \${response.status}: API Key bermasalah atau kuota terlampaui\`;
                        throw new Error(errMsg);
                      }

                      const data = await response.json();
                      const parts = data.candidates?.[0]?.content?.parts || [];
                      const text = parts.map(p => p.text).filter(Boolean).join('\\n') || "";

                      let sources = [];
                      const groundingChunks = data.candidates?.[0]?.groundingMetadata?.groundingChunks;
                      if (groundingChunks && Array.isArray(groundingChunks)) {
                        sources = groundingChunks
                          .filter(chunk => chunk.web)
                          .map(chunk => ({
                            title: chunk.web?.title || chunk.web?.uri || "Sumber Web",
                            uri: chunk.web?.uri
                          }));
                      }

                      return { text, sources };
                    } catch (err) {
                      lastError = err;
                      console.warn(\`Gemini model \${model} gagal:\`, err.message);
                    }
                  }

                  throw lastError || new Error("Gagal mengoperasikan API Gemini. Periksa API Key Anda.");
                }

                async function callOpenRouterAPI(prompt, apiKey, systemInstruction, model = 'openrouter/free', useSearch = false) {
                    const keyToUse = apiKey ? apiKey.trim() : "";
                    if (!keyToUse) {
                        throw new Error("OpenRouter API Key tidak ditemukan. Dapatkan gratis di https://openrouter.ai/keys");
                    }

                    try {
                        const messages = [];
                        
                        if (systemInstruction) {
                            messages.push({ role: 'system', content: systemInstruction });
                        }
                        
                        messages.push({ role: 'user', content: prompt });

                        let finalPrompt = prompt;
                        if (useSearch) {
                            finalPrompt = \`[Gunakan pengetahuan terbaru Anda] \${prompt}\`;
                            messages[messages.length - 1].content = finalPrompt;
                        }

                        const requestBody = {
                            model: model || 'openrouter/free',
                            messages: messages,
                            temperature: 0.7,
                            max_tokens: 4096,
                            top_p: 1,
                            frequency_penalty: 0,
                            presence_penalty: 0,
                        };

                        const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': \`Bearer \${keyToUse}\`,
                                'HTTP-Referer': window.location.origin,
                                'X-Title': 'Kok Bisa Studio AI'
                            },
                            body: JSON.stringify(requestBody)
                        });

                        if (!response.ok) {
                            let errorMessage = \`HTTP \${response.status}: \${response.statusText}\`;
                            try {
                                const errData = await response.json();
                                errorMessage = errData.error?.message || errData.message || errorMessage;
                            } catch (e) {
                                const text = await response.text();
                                errorMessage = text || errorMessage;
                            }
                            throw new Error(errorMessage);
                        }

                        const data = await response.json();
                        const text = data.choices?.[0]?.message?.content || "";

                        if (!text) {
                            throw new Error("Tidak ada konten dari model AI");
                        }

                        return { text, sources: [] };
                    } catch (err) {
                        console.error('OpenRouter API Error:', err);
                        throw err;
                    }
                }

                async function generateImagePreview(prompt, apiKey, aspectRatio = "16:9", provider = 'gemini') {
                    if (provider === 'gemini' && apiKey) {
                        try {
                            const endpoint = \`https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-001:predict?key=\${apiKey}\`;
                            const payload = {
                                instances: [{ prompt: prompt }],
                                parameters: { 
                                    sampleCount: 1,
                                    aspectRatio: aspectRatio === "9:16" ? "9:16" : "16:9"
                                }
                            };

                            const response = await fetch(endpoint, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            });

                            if (response.ok) {
                                const result = await response.json();
                                if (result.predictions?.[0]?.bytesBase64Encoded) {
                                    return \`data:image/png;base64,\${result.predictions[0].bytesBase64Encoded}\`;
                                }
                            }
                        } catch (e) {
                            console.warn("Imagen API gagal, menggunakan generator cadangan:", e);
                        }
                    }

                    const width = aspectRatio === "9:16" ? 720 : 1280;
                    const height = aspectRatio === "9:16" ? 1280 : 720;
                    const seed = Math.floor(Math.random() * 100000);
                    const cleanPrompt = prompt.substring(0, 200).replace(/[^a-zA-Z0-9\\s,.]/g, '');
                    return \`https://image.pollinations.ai/prompt/\${encodeURIComponent(cleanPrompt)}?width=\${width}&height=\${height}&seed=\${seed}&nologo=true\`;
                }

                function parseScriptToVisualPrompts(scriptText, visualStyle = VISUAL_STYLES[0].promptPrefix, aspectFormat = "16:9", language = 'indonesia') {
                  if (!scriptText || scriptText.trim().length === 0) return [];

                  const paragraphs = scriptText
                    .split(/\\n\\s*\\n/)
                    .map(p => p.trim())
                    .filter(p => p.length > 20);

                  if (paragraphs.length === 0) return [];

                  const scenes = [];
                  const ratioDescription = aspectFormat === "9:16" 
                    ? "9:16 vertical mobile aspect ratio, vertical portrait composition, full screen phone view" 
                    : "16:9 widescreen landscape ratio, horizontal YouTube format";

                  const lang = LANGUAGE_CONFIG[language] || LANGUAGE_CONFIG.indonesia;

                  paragraphs.forEach((chunk, i) => {
                    const sceneIndex = i + 1;
                    const sceneNum = String(sceneIndex).padStart(3, '0');
                    const contextSnippet = chunk.substring(0, 120) + (chunk.length > 120 ? "..." : "");

                    let cleanSceneConcept = chunk;
                    if (language === 'indonesia') {
                      cleanSceneConcept = chunk.replace(/Begitu kamu|Lalu,|Di sini,|Nah,|Tahukah kamu|Sebab,|Jadi,/gi, '').trim();
                    } else {
                      cleanSceneConcept = chunk.replace(/So,|Then,|Here,|Now,|You know|Because,/gi, '').trim();
                    }

                    const contextText = language === 'indonesia' 
                      ? \`Adegan \${sceneIndex}: \${contextSnippet}\` 
                      : \`Scene \${sceneIndex}: \${contextSnippet}\`;

                    scenes.push({
                      id: \`img-\${sceneIndex}\`,
                      sceneNum,
                      context: contextText,
                      prompt: \`\${visualStyle}. Detailed concept scene illustration of: \${cleanSceneConcept.substring(0, 150)}. Cinematic framing, expressive storytelling visual, vivid details, \${ratioDescription}.\`
                    });
                  });

                  return scenes;
                }

                                        target="_blank"
                                        rel="noreferrer"
                                        className="px-4 py-1.5 rounded-lg text-xs font-medium bg-emerald-100 text-emerald-700 hover:bg-emerald-200 transition flex items-center space-x-1.5"
                                      >
                                        <ExternalLink className="w-3 h-3" />
                                        <span>Ambil Key</span>
                                      </a>
                                    )}

                                    {getActiveApiKey() && (
                                      <button
                                        type="button"
                                        onClick={() => {
                                          if (apiProvider === 'openrouter') {
                                            setOpenRouterApiKey('');
                                            localStorage.removeItem('openrouter_api_key');
                                          } else {
                                            setGeminiApiKey('');
                                            localStorage.removeItem('gemini_api_key');
                                          }
                                          showToast('API Key dihapus', 'info');
                                        }}
                                        className="px-4 py-1.5 rounded-lg text-xs font-medium bg-red-50 text-red-600 hover:bg-red-100 transition"
                                      >
                                        Hapus
                                      </button>
                                    )}
                                  </div>

                                  {keyTestResult && (
                                    <div className={\`mt-2 p-3 rounded-xl text-xs font-medium \${
                                      keyTestResult.success 
                                        ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' 
                                        : 'bg-red-50 text-red-800 border border-red-200'
                                    }\`}>
                                      {keyTestResult.message}
                                    </div>
                                  )}
                                </div>

                                <div className="pt-2 flex items-center space-x-3">
                                  <button 
                                    onClick={() => {
                                      saveApiConfig();
                                      if (!getActiveApiKey().trim()) {
                                        showToast(\`Masukkan API Key \${apiProvider === 'gemini' ? 'Gemini' : 'OpenRouter'} Anda\`, "error");
                                        return;
                                      }
                                      showToast(\`Pengaturan API berhasil disimpan! (\${getModelDisplayName()})\`, "success");
                                    }}
                                    className="flex-1 py-2.5 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl transition shadow-md"
                                  >
                                    Simpan Pengaturan
                                  </button>
                                </div>

                                <div className="bg-slate-50 rounded-xl p-4 border border-slate-200">
                                  <p className="text-xs text-slate-600">
                                    <strong>{t('provider')}:</strong> {apiProvider === 'gemini' ? 'Google Gemini' : 'OpenRouter'}
                                    <br />
                                    <strong>{t('model')}:</strong> {getModelDisplayName()}
                                    <br />
                                    <strong>{t('status')}:</strong> {getActiveApiKey() ? '✅ ' + t('connected') : '❌ ' + t('disconnected')}
                                    <br />
                                    <strong>{t('language')}:</strong> <span className="flex items-center space-x-1"><Lock className="w-3 h-3 text-indigo-500" /> {getLangConfig().flag} {getLangConfig().label}</span>
                                  </p>
                                </div>

                                {apiProvider === 'openrouter' && (
                                  <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-xs text-emerald-800">
                                    <p className="font-bold">💡 OpenRouter FREE Models:</p>
                                    <ul className="list-disc pl-4 mt-1 space-y-0.5 text-emerald-700">
                                      <li><strong>openrouter/free</strong> - Auto-select model terbaik yang tersedia</li>
                                      <li>Semua model dengan label <strong>FREE</strong> bisa digunakan tanpa biaya</li>
                                      <li>Banyak pilihan dari berbagai provider (Google, NVIDIA, Meta, dll)</li>
                                    </ul>
                                  </div>
                                )}
                              </div>
                            </div>
                          )}
                        </main>
                      </div>
                    </div>
                  );
                }

                const root = ReactDOM.createRoot(document.getElementById('mainApp'));
                root.render(<App />);
            `;
            document.body.appendChild(script);
        }

        function handleLogin() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            loginError.classList.remove('show');

            if (!username || !password) {
                errorText.textContent = 'Username dan password harus diisi!';
                loginError.classList.add('show');
                return;
            }

            if (username === VALID_CREDENTIALS.username && password === VALID_CREDENTIALS.password) {
                localStorage.setItem('studio_session', 'logged_in');
                showApp();
            } else {
                errorText.textContent = 'Username atau password salah! Hubungi admin jika lupa.';
                loginError.classList.add('show');
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const active = document.activeElement;
                if (active === usernameInput || active === passwordInput) {
                    handleLogin();
                }
            }
        });

        checkSession();

        console.log('🔐 Studio Konten Pro - Login System');
        console.log('📌 Username: ' + VALID_CREDENTIALS.username);
        console.log('📌 Password: ' + VALID_CREDENTIALS.password);
    </script>

</body>
</html>
